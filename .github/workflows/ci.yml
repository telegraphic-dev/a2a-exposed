name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # latest 22.x; the Worker tests and cf need 22.18+
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Worker - install
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Worker - tests
        working-directory: worker
        run: npm test

      - name: Worker - typecheck
        working-directory: worker
        run: |
          npx cf workers types
          npx tsc --noEmit

      # cf build only bundles locally: no Cloudflare credentials are needed (or available) here.
      - name: Worker - build
        working-directory: worker
        run: npx cf build

      - name: CLI - tests
        working-directory: cli
        run: npm test

      - name: Skills - discovery
        run: |
          # strip colors: the skills CLI colors output even without a TTY
          npx --yes skills add ./ --list | sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g' | tee skills-list.txt
          for s in a2a-exposed a2a-exposed-setup; do
            grep -Eq "(^|[^-[:alnum:]])$s([^-[:alnum:]]|$)" skills-list.txt || { echo "::error::skill $s not discovered"; exit 1; }
          done


      - name: Skills - agentskills validate
        run: |
          python3 -m venv .skills-ref-venv
          .skills-ref-venv/bin/pip install -q "skills-ref @ git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
          .skills-ref-venv/bin/skills-ref validate skills/a2a-exposed
          .skills-ref-venv/bin/skills-ref validate skills/a2a-exposed-setup

      - name: Plugin - agent-plugins schema
        run: |
          .skills-ref-venv/bin/pip install -q jsonschema
          .skills-ref-venv/bin/python - <<'PY'
          import json, urllib.request, jsonschema
          from pathlib import Path
          schema = json.loads(urllib.request.urlopen("https://agent-plugins.org/schemas/1.0.0/plugin.schema.json").read())
          jsonschema.Draft202012Validator(schema).validate(json.loads(Path("plugin.json").read_text()))
          print("plugin.json: valid")
          PY
      - name: CLI - npm pack (dry run)
        working-directory: cli
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q "worker/cloudflare.config.ts" pack.txt || { echo "::error::Worker template missing from the package"; exit 1; }
