name: Publish

# Push a v<semver> tag (e.g. v0.1.0) on main to publish the CLI to npm and create a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub release
  id-token: write # npm provenance / trusted publishing (OIDC)

concurrency:
  group: publish-${{ github.ref }}

env:
  DO_NOT_TRACK: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC, no token) needs npm 11.5.1+; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Check committed release version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<semver>"; exit 1
          fi
          COMMITTED_VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("cli/package.json", "utf8")).version')"
          if [[ "$VERSION" != "$COMMITTED_VERSION" ]]; then
            echo "::error::tag version $VERSION differs from committed CLI version $COMMITTED_VERSION; merge a PR running npm run version:set -- $VERSION before tagging"; exit 1
          fi
          if ! node scripts/check-skill-plugin.mjs; then
            echo "::error::committed release versions or plugin metadata are inconsistent; run npm run version:set before tagging"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Worker - install, test, typecheck, build
        working-directory: worker
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx cf workers types
          npx tsc --noEmit
          npx cf build

      - name: CLI - tests
        working-directory: cli
        run: npm test

      - name: Control - install, test, typecheck, build
        working-directory: control
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx cf workers types
          npx tsc --noEmit
          npm run build
          node scripts/check-build.mjs

      # CLI package. Auth is the NPM_TOKEN secret. prepack bundles ../worker (scripts/sync-worker.mjs).
      - name: Publish to npm
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "a2a-exposed@$VERSION" version >/dev/null 2>&1; then
            echo "a2a-exposed@$VERSION is already on npm; skipping publish"
            exit 0
          fi
          DIST_TAG=latest
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; fi
          npm publish --provenance --access public --tag "$DIST_TAG"

      # prepare compiles dist/index.js and dist/types using control/node_modules.
      # A file: install runs prepare. npm pack and npm publish run prepare and prepack.
      # Trusted publishing (OIDC). This step does not use NPM_TOKEN.
      # setup-node's user npmrc has an _authToken line for the CLI publish. An empty
      # token there stops npm from exchanging the Actions OIDC token, so this step
      # uses a registry-only npmrc and unsets NODE_AUTH_TOKEN.
      - name: Publish control-core
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          unset NODE_AUTH_TOKEN
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-control-core"
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
          export NPM_CONFIG_USERCONFIG
          if npm view "@a2a-exposed/control-core@$VERSION" version >/dev/null 2>&1; then
            echo "@a2a-exposed/control-core@$VERSION is already on npm; skipping publish"
            exit 0
          fi
          DIST_TAG=latest
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; fi
          npm publish --provenance --access public --tag "$DIST_TAG"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"; exit 0
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          **Run the CLI** (Node 22.18+; no install needed)
          ```bash
          npx -y a2a-exposed@latest --help    # this release: npx -y a2a-exposed@@VERSION@; optional global install: npm i -g a2a-exposed@latest
          ```

          **Install the agent skills**
          ```bash
          npx -y skills add telegraphic-dev/a2a-exposed    # into the current project
          # Hermes Agent:
          hermes skills install telegraphic-dev/a2a-exposed/skills/a2a-exposed
          hermes skills install telegraphic-dev/a2a-exposed/skills/a2a-exposed-setup
          ```

          **Upgrade an existing deployment:** `a2a-exposed deploy` (re-syncs the Worker template and redeploys; secrets are kept).

          NOTES
          sed -i "s/@VERSION@/$VERSION/g" "$RUNNER_TEMP/notes.md"
          PRERELEASE=()
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "a2a-exposed $VERSION" \
            --generate-notes --notes-file "$RUNNER_TEMP/notes.md" "${PRERELEASE[@]}"

      # ClawHub (OpenClaw skill registry): not enabled yet. ClawHub publishes every skill under MIT-0
      # and needs an owner handle decision. When decided, add a CLH_TOKEN secret and, per skill folder:
      #   npm i -g clawhub && clawhub login --token "$CLH_TOKEN" --no-browser
      #   clawhub skill publish skills/a2a-exposed --slug a2a-exposed --name "A2A Exposed" \
      #     --version "$VERSION" --changelog "Release $GITHUB_REF_NAME"
      #   clawhub skill publish skills/a2a-exposed-setup --slug a2a-exposed-setup --name "A2A Exposed: setup" \
      #     --version "$VERSION" --changelog "Release $GITHUB_REF_NAME"
