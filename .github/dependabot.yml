version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directories:
      - /
      - /cli
      - /worker
      - /control
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-patch-updates:
        dependency-type: development
        update-types: [patch]
