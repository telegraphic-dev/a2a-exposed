name: Feature request
description: An idea for a2a-exposed.
title: "[idea] "
labels: ["enhancement", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        This report is filed as a public GitHub issue on telegraphic-dev/a2a-exposed.
        Do not include confidential information: secrets, tokens, owner or pairing tokens, private URLs or hostnames, message contents, or personal data.
  - type: textarea
    id: message
    attributes:
      label: What happened
      description: The idea, and why it would help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: a2a-exposed version
      description: Optional. The CLI version, and the inbox Worker version if you know it.
      placeholder: 0.8.0 (worker 0.8.0)
    validations:
      required: false
  - type: input
    id: connection
    attributes:
      label: Connection type
      description: Optional. webhook, proxy, or polling.
    validations:
      required: false
  - type: input
    id: deployment
    attributes:
      label: Deployment
      description: Optional. hosted or self-hosted.
    validations:
      required: false
  - type: input
    id: agent
    attributes:
      label: Agent
      description: Optional. Claude Code, Grok Bot, n8n, or custom.
    validations:
      required: false
