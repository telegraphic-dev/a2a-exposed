name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # latest 22.x; the Worker tests and cf need 22.18+
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Worker - install
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Worker - tests
        working-directory: worker
        run: npm test

      - name: Worker - typecheck
        working-directory: worker
        run: |
          npx cf workers types
          npx tsc --noEmit

      # cf build only bundles locally: no Cloudflare credentials are needed (or available) here.
      - name: Worker - build
        working-directory: worker
        run: npx cf build

      - name: CLI - tests
        working-directory: cli
        run: npm test

      - name: Skills - discovery
        run: |
          # strip colors: the skills CLI colors output even without a TTY
          npx --yes skills add ./ --list | sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g' | tee skills-list.txt
          for s in a2a-exposed a2a-exposed-setup; do
            grep -Eq "(^|[^-[:alnum:]])$s([^-[:alnum:]]|$)" skills-list.txt || { echo "::error::skill $s not discovered"; exit 1; }
          done


      - name: Skills - agentskills validate
        run: |
          python3 -m venv .skills-ref-venv
          .skills-ref-venv/bin/pip install -q "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          .skills-ref-venv/bin/skills-ref validate skills/a2a-exposed
          .skills-ref-venv/bin/skills-ref validate skills/a2a-exposed-setup

      - name: Plugin - agent-plugins schema
        run: |
          .skills-ref-venv/bin/pip install -q jsonschema pyyaml
          .skills-ref-venv/bin/python scripts/check-plugin-schemas.py
          .skills-ref-venv/bin/python scripts/check-skill-metadata.py

      - name: Plugins - version and metadata drift
        run: node scripts/check-skill-plugin.mjs

      - name: Plugin - claude plugin validate
        run: npx --yes @anthropic-ai/claude-code@2.1.296 plugin validate . --strict
      - name: CLI - npm pack (dry run)
        working-directory: cli
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q "worker/cloudflare.config.ts" pack.txt || { echo "::error::Worker template missing from the package"; exit 1; }
          if grep -q "control/" pack.txt; then echo "::error::control/ must stay out of the npm package"; exit 1; fi

  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control/package-lock.json

      - name: Control - install
        working-directory: control
        run: npm ci --no-audit --no-fund

      # Node tests, plus Vitest inside Miniflare with the Cloudflare API mocked.
      - name: Control - tests
        working-directory: control
        run: npm test

      - name: Control - typecheck
        working-directory: control
        run: |
          npx cf workers types
          npx tsc --noEmit

      - name: Control - neutral build
        working-directory: control
        run: |
          npm run build
          node scripts/check-build.mjs

      - name: Control - route shape
        working-directory: control
        env:
          CONTROL_HOSTNAME: control.example.com
          CONTROL_ROUTE: example.com/*
          CONTROL_ROUTE_ZONE: example.com
        run: |
          npx cf build
          node scripts/check-build.mjs --routes

  # The existing Worker suite against real D1 and a SQLite Durable Object (workerd via Miniflare).
  # The node:sqlite run stays in the job above. migrations.test.ts uses d1On and does not follow STORAGE_BACKEND.
  worker-storage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [d1, do]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Worker - install
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Worker - tests (${{ matrix.backend }})
        working-directory: worker
        env:
          STORAGE_BACKEND: ${{ matrix.backend }}
        run: npm test
